{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Admin Activities</h2>
    <div class="row mt-4">
        <div class="col-md-6">
            <div class="card mb-3">
                <div class="card-body">
                    <h5 class="card-title">Event Management</h5>
                    <a href="{{ url_for('auth.add_event') }}" class="btn btn-primary mb-2">Add Event</a>
                    <a href="{{ url_for('auth.manage_events') }}" class="btn btn-info">Manage Events</a>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card mb-3">
                <div class="card-body">
                    <h5 class="card-title">Member Management</h5>
                    <a href="{{ url_for('auth.add_member') }}" class="btn btn-primary mb-2">Add Member</a>
                    <a href="{{ url_for('auth.manage_members') }}" class="btn btn-info">Manage Members</a>
                </div>
            </div>
        </div>
    </div>
    <div class="mt-3">
        <a href="{{ url_for('auth.admin_logout') }}" class="btn btn-danger">Logout</a>
    </div>
</div>
{% endblock %}
