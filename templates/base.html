<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanisa</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
</head>
<body>
    {% if show_content %}
    <header>
        <nav>
            <ul>
                <li><a href="{{ url_for('auth.login') }}">Member Login</a></li>
                <li><a href="{{ url_for('auth.sign_up') }}">Member Signup</a></li>
                <li><a href="{{ url_for('auth.admin_dashboard') }}">Admin Dashboard</a></li>
            </ul>
        </nav>
    </header>
    {% endif %}
    <main>
        {% block content %}
        {% endblock %}
    </main>
    {% if show_content %}
    <footer>
        <p>&copy; 2023 Kanisa. All rights reserved.</p>
    </footer>
    {% endif %}
</body>
</html>
